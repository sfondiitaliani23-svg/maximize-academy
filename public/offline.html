<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<title>Sei offline | Maximize Academy</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #f4f4f4; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
  main { min-height: 100%; display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 96px; height: 96px; border-radius: 20px; margin-bottom: 20px; }
  h1 { font-size: 22px; letter-spacing: .06em; color: #bfa16a; margin: 0 0 8px; text-transform: uppercase; }
  p { margin: 0 0 22px; color: #bdbdbd; line-height: 1.5; }
  button { background: #bfa16a; color: #111; border: 0; border-radius: 999px; padding: 12px 26px; font-weight: 700; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <div>
    <img src="/icons/icon-192.png" alt="Maximize Academy">
    <h1>Sei offline</h1>
    <p>Manca la connessione. Appena torna, riprova.<br><span lang="en">You are offline. Try again when you are back online.</span></p>
    <button type="button" onclick="location.reload()">Riprova</button>
  </div>
</main>
</body>
</html>
