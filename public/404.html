<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagina non trovata | Maximize Academy</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #070709;
      color: #d1d5db;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    /* Background particles */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 30%, rgba(212,175,55,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 70%, rgba(212,175,55,0.04) 0%, transparent 60%);
      pointer-events: none;
    }
    .container {
      text-align: center;
      padding: 40px 24px;
      max-width: 560px;
      animation: fadeIn 0.8s ease both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .badge {
      display: inline-block;
      font-size: 10px;
      letter-spacing: .35em;
      text-transform: uppercase;
      color: #d4af37;
      font-weight: 700;
      border: 1px solid rgba(212,175,55,0.3);
      padding: 6px 16px;
      border-radius: 100px;
      margin-bottom: 32px;
      background: rgba(212,175,55,0.05);
    }
    .number {
      font-family: 'Cinzel', serif;
      font-size: clamp(100px, 20vw, 160px);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #E8C878 0%, #D4AF37 50%, #AA820A 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      opacity: 0.9;
      text-shadow: none;
      filter: drop-shadow(0 0 40px rgba(212,175,55,0.3));
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin: 20px 0 12px;
    }
    p {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.7;
      margin-bottom: 40px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 32px;
      border-radius: 12px;
      background: linear-gradient(135deg, #D4AF37, #AA820A);
      color: #000;
      font-weight: 800;
      font-size: 13px;
      text-decoration: none;
      letter-spacing: .05em;
      transition: filter 0.2s, transform 0.2s;
      box-shadow: 0 8px 30px rgba(212,175,55,0.3);
    }
    .btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
    .divider {
      margin: 40px auto;
      width: 60px;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(212,175,55,0.4), transparent);
    }
    .links {
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
      font-size: 12px;
    }
    .links a {
      color: #4b5563;
      text-decoration: none;
      transition: color 0.2s;
    }
    .links a:hover { color: #d4af37; }
  </style>
</head>
<body>
  <div class="container">
    <span class="badge">Maximize Academy</span>
    <div class="number">404</div>
    <h1>Pagina non trovata</h1>
    <p>La pagina che stai cercando non esiste o è stata spostata.<br>Torna alla home e scopri l'ecosistema Maximize.</p>
    <a href="/" class="btn">
      ← Torna alla Home
    </a>
    <div class="divider"></div>
    <nav class="links">
      <a href="/#formazione">Formazione</a>
      <a href="/#barber-reset">Barber Reset</a>
      <a href="/#sabey">Sabey Scissors</a>
      <a href="/#contatti">Contatti</a>
    </nav>
  </div>
</body>
</html>
